name: Validate isolated budget Worker
on:
  pull_request:
    paths:
      - "budget-worker/**"
      - ".github/workflows/validate-budget-worker.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Verify write endpoints are disabled
        run: node --test budget-worker/test/*.test.mjs
      - name: Bundle without deployment
        run: npx wrangler deploy --dry-run --config budget-worker/wrangler.jsonc --outdir /tmp/budget-worker
