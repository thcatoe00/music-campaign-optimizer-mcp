name: Validate secure MCP gateway

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "wrangler.jsonc"
      - ".github/workflows/validate-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript
        run: npm run type-check
      - name: Run optimizer safety tests
        run: npm test
      - name: Bundle Worker without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/music-mcp-compiled
